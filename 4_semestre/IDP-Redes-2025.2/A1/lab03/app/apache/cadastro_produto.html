<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cadastro de Produtos</title>
 <style>
 body { font-family: Arial, sans-serif; margin: 40px; }
 .container { max-width: 600px; margin: 0 auto; }
 .form-group { margin-bottom: 15px; }
 label { display: block; margin-bottom: 5px; }
 input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; borderradius: 4px; }
 button { background: #000; color: white; padding: 10px 15px; border: none;
border-radius: 4px; cursor: pointer; }
 .message { margin-top: 20px; padding: 10px; border-radius: 4px; }
 .success { background: #d4edda; color: #155724; }
 .error { background: #f8d7da; color: #721c24; }
 </style>
</head> 
<body>
 <div class="container">
			<h1>Cadastro de Produtos</h1>
 <form id="produtoForm">
 <div class="form-group">
 <label for="nome">Nome do Produto:</label>
 <input type="text" id="nome" name="nome" required>
 </div>

 <div class="form-group">
 <label for="descricao">Descrição:</label>
 <textarea id="descricao" name="descricao" rows="3"></textarea>
 </div>

 <div class="form-group">
 <label for="preco">Preço (R$):</label>
 <input type="number" id="preco" name="preco" step="0.01" min="0"
required>
 </div>

 <div class="form-group">
 <label for="quantidade">Quantidade:</label>
 <input type="number" id="quantidade" name="quantidade" min="0"
required>
 </div>

 <button type="submit">Cadastrar Produto</button>
 </form>
 
 <div id="message" class="message" style="display: none;"></div>
 </div>
 <script>
 document.getElementById('produtoForm').addEventListener('submit',
function(e) {
 e.preventDefault();

 const formData = new FormData(this);
 const messageDiv = document.getElementById('message');

 fetch('processa_cadastro.php', {
 method: 'POST',
 body: formData
 })
 .then(response => response.json())
 .then(data => {
 messageDiv.style.display = 'block';
 if (data.success) {
 messageDiv.className = 'message success';
 messageDiv.innerHTML = data.message;
 document.getElementById('produtoForm').reset();
 } else {
 messageDiv.className = 'message error';
 messageDiv.innerHTML = 'Erro: ' + data.message;
 }
 })
 .catch(error => { 
 messageDiv.style.display = 'block';
 messageDiv.className = 'message error';
 messageDiv.innerHTML = 'Erro de conexão: ' + error;
 });
 });
 </script>
</body>
</html>
